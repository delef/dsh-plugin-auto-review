name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --legacy-peer-deps
      - run: npm run build
      - run: npm test
      - name: Verify committed Git-install artifacts
        run: |
          git diff --exit-code -- lib
          test -z "$(git ls-files --others --exclude-standard -- lib)"
      - run: npm pack --ignore-scripts --dry-run
